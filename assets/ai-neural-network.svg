<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b112c" />
      <stop offset="100%" stop-color="#070a18" />
    </linearGradient>

    <!-- Scanning Laser Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 240, 255, 0.05)" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="rgba(0, 240, 255, 0.2)" />
    </pattern>

    <style>
      .synapse-line {
        stroke: rgba(0, 240, 255, 0.25);
        stroke-width: 1.2;
        stroke-dasharray: 4, 4;
        animation: dashMove 20s linear infinite;
      }
      .synapse-active {
        stroke: #A855F7;
        stroke-width: 1.8;
        filter: url(#neonGlow);
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes radarSweep {
        0% { transform: translateX(-200px); }
        100% { transform: translateX(1400px); }
      }
      .scan-beam {
        animation: radarSweep 6s ease-in-out infinite;
      }
      .node-text {
        font-family: 'Courier New', monospace;
        font-size: 11px;
        fill: #00F0FF;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="12" />
  <rect width="100%" height="100%" fill="url(#cyberGrid)" rx="12" />

  <!-- Scanning Laser Beam -->
  <rect class="scan-beam" y="0" width="160" height="280" fill="url(#scanGrad)" opacity="0.3" />

  <!-- ========================================== -->
  <!-- NEURAL CONSTELLATION CONNECTIONS (SYNAPSES) -->
  <!-- ========================================== -->
  <g id="synapses">
    <!-- Row 1 Connections -->
    <line x1="80" y1="60" x2="220" y2="40" class="synapse-line" />
    <line x1="220" y1="40" x2="380" y2="80" class="synapse-line" />
    <line x1="380" y1="80" x2="520" y2="45" class="synapse-line" />
    <line x1="520" y1="45" x2="680" y2="70" class="synapse-line" />
    <line x1="680" y1="70" x2="840" y2="40" class="synapse-line" />
    <line x1="840" y1="40" x2="980" y2="85" class="synapse-line" />
    <line x1="980" y1="85" x2="1120" y2="50" class="synapse-line" />

    <!-- Cross & Vertical Synapses -->
    <line x1="80" y1="60" x2="140" y2="160" class="synapse-line" />
    <line x1="220" y1="40" x2="300" y2="140" class="synapse-line" />
    <line x1="380" y1="80" x2="450" y2="180" class="synapse-line" />
    <line x1="520" y1="45" x2="600" y2="150" class="synapse-line" />
    <line x1="680" y1="70" x2="760" y2="170" class="synapse-line" />
    <line x1="840" y1="40" x2="900" y2="150" class="synapse-line" />
    <line x1="980" y1="85" x2="1050" y2="175" class="synapse-line" />

    <!-- Row 2 Connections -->
    <line x1="140" y1="160" x2="300" y2="140" class="synapse-line" />
    <line x1="300" y1="140" x2="450" y2="180" class="synapse-line" />
    <line x1="450" y1="180" x2="600" y2="150" class="synapse-line" />
    <line x1="600" y1="150" x2="760" y2="170" class="synapse-line" />
    <line x1="760" y1="170" x2="900" y2="150" class="synapse-line" />
    <line x1="900" y1="150" x2="1050" y2="175" class="synapse-line" />

    <!-- Row 3 Connections to Bottom -->
    <line x1="140" y1="160" x2="200" y2="240" class="synapse-line" />
    <line x1="300" y1="140" x2="360" y2="230" class="synapse-line" />
    <line x1="450" y1="180" x2="520" y2="245" class="synapse-line" />
    <line x1="600" y1="150" x2="680" y2="235" class="synapse-line" />
    <line x1="760" y1="170" x2="820" y2="240" class="synapse-line" />
    <line x1="900" y1="150" x2="960" y2="230" class="synapse-line" />
    <line x1="1050" y1="175" x2="1110" y2="235" class="synapse-line" />

    <!-- Horizontal Bottom Line -->
    <line x1="200" y1="240" x2="360" y2="230" class="synapse-line" />
    <line x1="360" y1="230" x2="520" y2="245" class="synapse-line" />
    <line x1="520" y1="245" x2="680" y2="235" class="synapse-line" />
    <line x1="680" y1="235" x2="820" y2="240" class="synapse-line" />
    <line x1="820" y1="240" x2="960" y2="230" class="synapse-line" />
    <line x1="960" y1="230" x2="1110" y2="235" class="synapse-line" />
  </g>

  <!-- ========================================== -->
  <!-- DYNAMIC PULSING / BLINKING NEURAL NODES    -->
  <!-- ========================================== -->
  <g id="blinking-nodes">
    <!-- Node 1 (80, 60) Cyan fast blink -->
    <circle cx="80" cy="60" r="4" fill="#00F0FF" filter="url(#intenseGlow)">
      <animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="80" cy="60" r="12" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="6;22;6" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Node 2 (220, 40) Purple pulse -->
    <circle cx="220" cy="40" r="5" fill="#A855F7" filter="url(#intenseGlow)">
      <animate attributeName="r" values="4;8;4" dur="2.7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.7s" repeatCount="indefinite" />
    </circle>

    <!-- Node 3 (380, 80) Cyan / Magenta flash -->
    <circle cx="380" cy="80" r="6" fill="#00F0FF" filter="url(#intenseGlow)">
      <animate attributeName="fill" values="#00F0FF;#FF007A;#00F0FF" dur="3s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;9;4" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="380" cy="80" r="15" fill="none" stroke="#FF007A" stroke-width="1.2">
      <animate attributeName="r" values="8;28;8" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0;0.9" dur="3s" repeatCount="indefinite" />
    </circle>

    <!-- Node 4 (520, 45) High-frequency blink -->
    <circle cx="520" cy="45" r="4.5" fill="#00FF88" filter="url(#intenseGlow)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="r" values="3;6;3" dur="1.4s" repeatCount="indefinite" />
    </circle>

    <!-- Node 5 (680, 70) Neural Hub Center -->
    <circle cx="680" cy="70" r="7" fill="#00F0FF" filter="url(#intenseGlow)">
      <animate attributeName="r" values="5;11;5" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="680" cy="70" r="18" fill="none" stroke="#00F0FF" stroke-width="1.5">
      <animate attributeName="r" values="10;32;10" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="2.2s" repeatCount="indefinite" />
    </circle>

    <!-- Node 6 (840, 40) Purple pulse -->
    <circle cx="840" cy="40" r="4" fill="#A855F7" filter="url(#intenseGlow)">
      <animate attributeName="r" values="3;6.5;3" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" />
    </circle>

    <!-- Node 7 (980, 85) Fast cyan synaptic burst -->
    <circle cx="980" cy="85" r="5" fill="#00F0FF" filter="url(#intenseGlow)">
      <animate attributeName="r" values="4;8.5;4" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="85" r="14" fill="none" stroke="#A855F7" stroke-width="1">
      <animate attributeName="r" values="7;24;7" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.8s" repeatCount="indefinite" />
    </circle>

    <!-- Node 8 (1120, 50) Green energy node -->
    <circle cx="1120" cy="50" r="4" fill="#00FF88" filter="url(#intenseGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite" />
    </circle>

    <!-- MIDDLE LAYER NODES -->
    <!-- Node 9 (140, 160) -->
    <circle cx="140" cy="160" r="4.5" fill="#A855F7" filter="url(#intenseGlow)">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5;7;3.5" dur="2.8s" repeatCount="indefinite" />
    </circle>

    <!-- Node 10 (300, 140) Synaptic Spark Node -->
    <circle cx="300" cy="140" r="6" fill="#00F0FF" filter="url(#intenseGlow)">
      <animate attributeName="r" values="4;9;4" dur="1.9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="300" cy="140" r="16" fill="none" stroke="#00F0FF" stroke-width="1.2">
      <animate attributeName="r" values="8;26;8" dur="1.9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0;0.9" dur="1.9s" repeatCount="indefinite" />
    </circle>

    <!-- Node 11 (450, 180) Core Agent Brain Node -->
    <circle cx="450" cy="180" r="7" fill="#FF007A" filter="url(#intenseGlow)">
      <animate attributeName="r" values="5;11;5" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="450" cy="180" r="20" fill="none" stroke="#FF007A" stroke-width="1.5">
      <animate attributeName="r" values="10;34;10" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0;1" dur="2.4s" repeatCount="indefinite" />
    </circle>

    <!-- Node 12 (600, 150) Super-Hub Central -->
    <circle cx="600" cy="150" r="8" fill="#00F0FF" filter="url(#intenseGlow)">
      <animate attributeName="r" values="6;13;6" dur="2.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="150" r="24" fill="none" stroke="#00F0FF" stroke-width="1.5">
      <animate attributeName="r" values="12;40;12" dur="2.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0;0.9" dur="2.6s" repeatCount="indefinite" />
    </circle>

    <!-- Node 13 (760, 170) -->
    <circle cx="760" cy="170" r="5" fill="#A855F7" filter="url(#intenseGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.3s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;8;4" dur="2.3s" repeatCount="indefinite" />
    </circle>

    <!-- Node 14 (900, 150) Synapse Burst -->
    <circle cx="900" cy="150" r="6" fill="#00FF88" filter="url(#intenseGlow)">
      <animate attributeName="r" values="4;9;4" dur="1.7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="900" cy="150" r="16" fill="none" stroke="#00FF88" stroke-width="1.2">
      <animate attributeName="r" values="8;28;8" dur="1.7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0;0.9" dur="1.7s" repeatCount="indefinite" />
    </circle>

    <!-- Node 15 (1050, 175) -->
    <circle cx="1050" cy="175" r="4.5" fill="#00F0FF" filter="url(#intenseGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" />
    </circle>

    <!-- BOTTOM LAYER NODES -->
    <!-- Node 16 (200, 240) -->
    <circle cx="200" cy="240" r="4" fill="#00F0FF" filter="url(#intenseGlow)">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite" />
    </circle>
    <!-- Node 17 (360, 230) -->
    <circle cx="360" cy="230" r="5" fill="#A855F7" filter="url(#intenseGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <!-- Node 18 (520, 245) -->
    <circle cx="520" cy="245" r="4.5" fill="#00FF88" filter="url(#intenseGlow)">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <!-- Node 19 (680, 235) -->
    <circle cx="680" cy="235" r="5" fill="#00F0FF" filter="url(#intenseGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <!-- Node 20 (820, 240) -->
    <circle cx="820" cy="240" r="4" fill="#FF007A" filter="url(#intenseGlow)">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.7s" repeatCount="indefinite" />
    </circle>
    <!-- Node 21 (960, 230) -->
    <circle cx="960" cy="230" r="5" fill="#00F0FF" filter="url(#intenseGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite" />
    </circle>
    <!-- Node 22 (1110, 235) -->
    <circle cx="1110" cy="235" r="4" fill="#A855F7" filter="url(#intenseGlow)">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.9s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ========================================== -->
  <!-- FLOATING DATA PARTICLES (SYNAPTIC STREAM)  -->
  <!-- ========================================== -->
  <g id="data-particles">
    <!-- Particle moving along line 1 -->
    <circle r="2.5" fill="#FFFFFF" filter="url(#intenseGlow)">
      <animateMotion path="M 80,60 L 220,40 L 380,80 L 520,45 L 680,70 L 840,40 L 980,85 L 1120,50" dur="7s" repeatCount="indefinite" />
    </circle>
    <!-- Particle moving along line 2 (opposite) -->
    <circle r="3" fill="#00F0FF" filter="url(#intenseGlow)">
      <animateMotion path="M 1050,175 L 900,150 L 760,170 L 600,150 L 450,180 L 300,140 L 140,160" dur="8s" repeatCount="indefinite" />
    </circle>
    <!-- Particle moving vertically down Hub -->
    <circle r="3" fill="#FF007A" filter="url(#intenseGlow)">
      <animateMotion path="M 680,70 L 600,150 L 680,235" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle r="2.5" fill="#00FF88" filter="url(#intenseGlow)">
      <animateMotion path="M 380,80 L 450,180 L 520,245" dur="5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ========================================== -->
  <!-- HOLOGRAPHIC AI LABELS                      -->
  <!-- ========================================== -->
  <text x="30" y="30" class="node-text" opacity="0.6">SYS_STATUS // NEURAL_MESH_ONLINE</text>
  <text x="1000" y="30" class="node-text" opacity="0.6" text-anchor="end">AGENTIC_SYNAPSE_RATE // 99.98%</text>
  
  <text x="600" y="195" text-anchor="middle" font-family="'Orbitron', 'Courier New', sans-serif" font-weight="800" font-size="14" fill="#00F0FF" letter-spacing="3" opacity="0.85">
    AUTONOMOUS AI SYNAPSE ENGINE
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
  </text>
  <text x="600" y="215" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#A855F7" letter-spacing="2" opacity="0.75">
    INTERACTIVE MULTI-AGENT CLOUD ORCHESTRATION
  </text>
</svg>
