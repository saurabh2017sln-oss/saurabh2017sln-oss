<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 170" width="100%" height="170">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c1f" />
      <stop offset="50%" stop-color="#0e1330" />
      <stop offset="100%" stop-color="#060917" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0055">
        <animate attributeName="stop-color" values="#FF0055;#A855F7;#00F0FF;#FFB703;#FF0055" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#00F0FF;#FFB703;#FF0055;#A855F7" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#FFB703;#FF0055;#A855F7;#00F0FF" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A6D" />
      <stop offset="100%" stop-color="#FF0055" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#0d0a22" />
    </linearGradient>

    <linearGradient id="btnBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0055" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="heartGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="btnGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Dot Pattern -->
    <pattern id="dotGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#182245" />
    </pattern>

    <style>
      .heart-beating {
        transform-origin: 95px 85px;
        animation: pulseHeart 1.35s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
      @keyframes pulseHeart {
        0% { transform: scale(1); }
        14% { transform: scale(1.22); }
        28% { transform: scale(1); }
        42% { transform: scale(1.28); }
        70% { transform: scale(1); }
        100% { transform: scale(1); }
      }

      .sparkle-1 {
        animation: twinkle 1.8s ease-in-out infinite alternate;
        transform-origin: 145px 42px;
      }
      .sparkle-2 {
        animation: twinkle 2.2s ease-in-out infinite alternate 0.6s;
        transform-origin: 45px 125px;
      }
      .sparkle-3 {
        animation: twinkle 1.5s ease-in-out infinite alternate 1.1s;
        transform-origin: 150px 128px;
      }
      @keyframes twinkle {
        0% { opacity: 0.2; transform: scale(0.6) rotate(0deg); }
        100% { opacity: 1; transform: scale(1.25) rotate(45deg); }
      }

      .btn-sweep {
        animation: shimmerSweep 3s infinite linear;
      }
      @keyframes shimmerSweep {
        0% { transform: translateX(-120px); opacity: 0; }
        20% { opacity: 0.6; }
        80% { opacity: 0.6; }
        100% { transform: translateX(250px); opacity: 0; }
      }

      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 19px;
        font-weight: 800;
        fill: #FFFFFF;
        letter-spacing: -0.2px;
      }
      .text-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12.5px;
        font-weight: 400;
        fill: #94A3B8;
      }
      .text-badge {
        font-family: 'SF Mono', Consolas, monospace;
        font-size: 10px;
        font-weight: 700;
        fill: #FF70A6;
        letter-spacing: 0.8px;
      }
      .text-feature {
        font-family: 'SF Mono', Consolas, monospace;
        font-size: 10.5px;
        font-weight: 600;
        fill: #00F0FF;
        letter-spacing: 0.2px;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="856" height="166" rx="18" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="2.5" />
  <rect x="2" y="2" width="856" height="166" rx="18" fill="url(#dotGrid)" />

  <!-- ========================================== -->
  <!-- 1. LEFT: ANIMATED PULSING 3D HEART         -->
  <!-- ========================================== -->
  <g class="heart-beating" filter="url(#heartGlow)">
    <!-- Heart Ambient Glow Ring -->
    <circle cx="95" cy="85" r="48" fill="#FF0055" opacity="0.12">
      <animate attributeName="r" values="46;54;46" dur="1.35s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.12;0.22;0.12" dur="1.35s" repeatCount="indefinite" />
    </circle>
    
    <!-- 3D Heart Shape -->
    <path d="M 95, 62 
             C 82, 45, 60, 48, 54, 66 
             C 48, 84, 68, 103, 95, 120 
             C 122, 103, 142, 84, 136, 66 
             C 130, 48, 108, 45, 95, 62 Z" 
          fill="url(#heartGrad)" stroke="#FFE5EC" stroke-width="1.8" />
          
    <!-- Specular Highlight on Heart -->
    <path d="M 64, 64 C 60, 74, 66, 85, 76, 92" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- Sparkles around Heart -->
  <!-- Sparkle 1 -->
  <g class="sparkle-1" filter="url(#sparkleGlow)">
    <path d="M 145, 34 L 148, 42 L 156, 45 L 148, 48 L 145, 56 L 142, 48 L 134, 45 L 142, 42 Z" fill="#FFD166" />
  </g>
  <!-- Sparkle 2 -->
  <g class="sparkle-2" filter="url(#sparkleGlow)">
    <path d="M 45, 118 L 47, 123 L 52, 125 L 47, 127 L 45, 132 L 43, 127 L 38, 125 L 43, 123 Z" fill="#00F0FF" />
  </g>
  <!-- Sparkle 3 -->
  <g class="sparkle-3" filter="url(#sparkleGlow)">
    <path d="M 150, 120 L 152, 126 L 158, 128 L 152, 130 L 150, 136 L 148, 130 L 142, 128 L 148, 126 Z" fill="#FF70A6" />
  </g>

  <!-- ========================================== -->
  <!-- 2. CENTER: CALL-TO-ACTION & DETAILS        -->
  <!-- ========================================== -->
  <!-- Top Badge Pill -->
  <rect x="180" y="26" width="220" height="22" rx="11" fill="rgba(255, 0, 85, 0.16)" stroke="#FF0055" stroke-width="1" />
  <text x="290" y="41" class="text-badge" text-anchor="middle">❤️ SHOW LOVE &amp; APPRECIATION</text>

  <!-- Title -->
  <text x="180" y="74" class="text-title">Liked My GitHub &amp; DevOps Blueprints?</text>

  <!-- Subtitle -->
  <text x="180" y="99" class="text-sub">Drop a quick Like &amp; Star ⭐ on this repo to show support &amp; bookmark the architecture!</text>

  <!-- Bottom Interactive Highlights -->
  <g transform="translate(180, 115)">
    <text x="0" y="16" class="text-feature">⚡ 1-Click Support • 🌟 Instant Stargazer Badge • 🚀 100+ Enterprise Blueprints</text>
  </g>

  <!-- ========================================== -->
  <!-- 3. RIGHT: INTERACTIVE LIKE & STAR CTA      -->
  <!-- ========================================== -->
  <g transform="translate(635, 42)" filter="url(#btnGlow)">
    <clipPath id="btnClip">
      <rect x="0" y="0" width="195" height="86" rx="16" />
    </clipPath>

    <!-- Outer Button Box -->
    <rect x="0" y="0" width="195" height="86" rx="16" fill="url(#btnBg)" stroke="url(#btnBorderGrad)" stroke-width="2.2" />

    <!-- Button Inner Shimmer Sweep -->
    <g clip-path="url(#btnClip)">
      <rect x="-80" y="0" width="40" height="86" fill="rgba(255, 255, 255, 0.25)" class="btn-sweep" transform="skewX(-25)" />
    </g>

    <!-- Button Content -->
    <!-- Mini Pulse Heart -->
    <path d="M 32, 28 
             C 28, 22, 21, 23, 19, 29 
             C 17, 35, 23, 41, 32, 47 
             C 41, 41, 47, 35, 45, 29 
             C 43, 23, 36, 22, 32, 28 Z" 
          fill="#FF0055">
      <animate attributeName="transform" type="scale" values="1;1.2;1" dur="1s" repeatCount="indefinite" additive="sum" />
    </path>

    <!-- CTA Headline -->
    <text x="56" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="800" fill="#FFFFFF" letter-spacing="0.5px">DROP A LIKE</text>
    
    <!-- CTA Star Subtext -->
    <text x="97" y="62" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#FFB703" text-anchor="middle" letter-spacing="0.8px">⭐ STAR ON GITHUB ⭐</text>

    <!-- Micro Arrow Indicator -->
    <path d="M 168, 34 L 176, 34 M 172, 30 L 176, 34 L 172, 38" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="transform" type="translate" values="0,0; 4,0; 0,0" dur="1.2s" repeatCount="indefinite" />
    </path>
  </g>
</svg>
