<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="480">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <marker id="arrowCyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00F0FF" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C084FC" />
    </marker>
    <marker id="arrowBase" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3748" />
    </marker>

    <pattern id="dotPattern" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#141a2e" />
    </pattern>

    <style>
      .base-arrow {
        fill: none;
        stroke: #252d47;
        stroke-width: 2;
        stroke-linecap: round;
      }
      .anim-arrow-cyan {
        fill: none;
        stroke: #00F0FF;
        stroke-width: 2.4;
        stroke-dasharray: 6 10;
        animation: flowDash 1.2s linear infinite;
        filter: url(#neonGlow);
      }
      .anim-arrow-purple {
        fill: none;
        stroke: #C084FC;
        stroke-width: 2.4;
        stroke-dasharray: 6 10;
        animation: flowDash 1.4s linear infinite;
        filter: url(#neonGlow);
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -32; }
      }
      .card-box {
        fill: #0c1022;
        stroke-width: 1.6;
        rx: 10;
      }
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        fill: #FFFFFF;
        text-anchor: middle;
      }
      .text-body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        fill: #cbd5e1;
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.3)); }
        50% { filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.6)); }
      }
      .root-pulse {
        animation: pulseGlow 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- PURE JET BLACK BACKGROUND -->
  <rect width="100%" height="100%" fill="#050814" rx="14" />
  <rect width="100%" height="100%" fill="url(#dotPattern)" rx="14" />

  <!-- ========================================== -->
  <!-- 1. BASE STATIC ARROWS                      -->
  <!-- ========================================== -->
  <g>
    <!-- Root to Left -->
    <path d="M 330, 95 C 330, 135, 220, 135, 220, 165" class="base-arrow" marker-end="url(#arrowBase)" />
    <!-- Root to Right -->
    <path d="M 470, 95 C 470, 135, 580, 135, 580, 165" class="base-arrow" marker-end="url(#arrowBase)" />
    <!-- Left to Sub -->
    <path d="M 220, 235 L 220, 260" class="base-arrow" marker-end="url(#arrowBase)" />
    <!-- Right to Sub -->
    <path d="M 580, 235 L 580, 260" class="base-arrow" marker-end="url(#arrowBase)" />
  </g>

  <!-- ========================================== -->
  <!-- 2. ANIMATED FLOWING LASER ARROWS          -->
  <!-- ========================================== -->
  <g>
    <!-- Anim Root to Left -->
    <path d="M 330, 95 C 330, 135, 220, 135, 220, 165" class="anim-arrow-cyan" marker-end="url(#arrowCyan)" />
    <!-- Anim Root to Right -->
    <path d="M 470, 95 C 470, 135, 580, 135, 580, 165" class="anim-arrow-purple" marker-end="url(#arrowPurple)" />
    <!-- Anim Left to Sub -->
    <path d="M 220, 235 L 220, 260" class="anim-arrow-cyan" marker-end="url(#arrowCyan)" />
    <!-- Anim Right to Sub -->
    <path d="M 580, 235 L 580, 260" class="anim-arrow-purple" marker-end="url(#arrowPurple)" />
  </g>

  <!-- ========================================== -->
  <!-- 3. TRAVELING DATA ORBS                     -->
  <!-- ========================================== -->
  <g>
    <circle r="3.5" fill="#00F0FF" filter="url(#neonGlow)">
      <animateMotion path="M 330, 95 C 330, 135, 220, 135, 220, 165" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#C084FC" filter="url(#neonGlow)">
      <animateMotion path="M 470, 95 C 470, 135, 580, 135, 580, 165" dur="1.5s" begin="0.3s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#00FF88" filter="url(#neonGlow)">
      <animateMotion path="M 220, 235 L 220, 260" dur="0.8s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#FF007A" filter="url(#neonGlow)">
      <animateMotion path="M 580, 235 L 580, 260" dur="0.8s" begin="0.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ========================================== -->
  <!-- 4. CARDS & TEXT                            -->
  <!-- ========================================== -->
  <g>
    <!-- Top Central Card -->
    <rect x="250" y="25" width="300" height="70" class="card-box root-pulse" stroke="#a6e3a1" />
    <text x="400" y="52" class="text-title" fill="#a6e3a1">🧠 Senior Architect Mindset</text>
    <text x="400" y="74" class="text-title" font-size="11.5" fill="#94a3b8">'What is the Business &amp; Functional Domain?'</text>

    <!-- Branch 1 (Left): Infra -->
    <rect x="80" y="165" width="280" height="70" class="card-box" stroke="#89b4fa" />
    <text x="220" y="195" class="text-title" fill="#89b4fa">🏗️ Infrastructure &amp; Platform</text>
    <text x="220" y="215" class="text-title" font-size="11" fill="#94a3b8">Engineering &amp; Landing Zones</text>

    <!-- Sub-card Left -->
    <rect x="60" y="260" width="320" height="180" class="card-box" stroke="#3b82f6" />
    <text x="80" y="295" class="text-body">• Multi-Region Landing Zones (CAF)</text>
    <text x="80" y="330" class="text-body">• DevSecOps &amp; Policy-as-Code</text>
    <text x="80" y="365" class="text-body">• Zero-Downtime Cloud Migration</text>
    <text x="80" y="400" class="text-body">• Disaster Recovery &amp; FinOps</text>

    <!-- Branch 2 (Right): App & AI -->
    <rect x="440" y="165" width="280" height="70" class="card-box" stroke="#cba6f7" />
    <text x="580" y="195" class="text-title" fill="#cba6f7">🤖 Application &amp; AI Systems</text>
    <text x="580" y="215" class="text-title" font-size="11" fill="#94a3b8">Architecture &amp; Design</text>

    <!-- Sub-card Right -->
    <rect x="420" y="260" width="320" height="180" class="card-box" stroke="#a855f7" />
    <text x="440" y="295" class="text-body">• Microservices vs Event-Driven Mesh</text>
    <text x="440" y="330" class="text-body">• AI Agentic Pipelines &amp; RAG Systems</text>
    <text x="440" y="365" class="text-body">• API Gateways &amp; Edge Routing</text>
    <text x="440" y="400" class="text-body">• State, Caching &amp; Distributed Systems</text>
  </g>
</svg>
