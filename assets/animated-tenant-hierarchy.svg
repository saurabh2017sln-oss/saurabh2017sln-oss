<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 640" width="100%" height="640">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <marker id="arrowCyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00F0FF" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#C084FC" />
    </marker>
    <marker id="arrowBase" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3748" />
    </marker>

    <pattern id="dotPattern" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#141a2e" />
    </pattern>

    <style>
      .base-arrow {
        fill: none;
        stroke: #252d47;
        stroke-width: 2;
        stroke-linecap: round;
      }
      .anim-arrow-cyan {
        fill: none;
        stroke: #00F0FF;
        stroke-width: 2.2;
        stroke-dasharray: 6 10;
        animation: flowDash 1.2s linear infinite;
        filter: url(#neonGlow);
      }
      .anim-arrow-purple {
        fill: none;
        stroke: #C084FC;
        stroke-width: 2.2;
        stroke-dasharray: 6 10;
        animation: flowDash 1.5s linear infinite;
        filter: url(#neonGlow);
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -32; }
      }
      .card-box {
        fill: #0c1022;
        stroke-width: 1.5;
        rx: 8;
      }
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: #FFFFFF;
        text-anchor: middle;
      }
      .text-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 10px;
        fill: #94a3b8;
        text-anchor: middle;
      }
      @keyframes rootPulse {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.3)); }
        50% { filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.6)); }
      }
      .root-pulse {
        animation: rootPulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#050814" rx="14" />
  <rect width="100%" height="100%" fill="url(#dotPattern)" rx="14" />

  <!-- ========================================== -->
  <!-- 1. BASE STATIC ARROWS                      -->
  <!-- ========================================== -->
  <g>
    <!-- Entra to Root -->
    <path d="M 475, 50 L 475, 80" class="base-arrow" marker-end="url(#arrowBase)" />
    <!-- Root to 3 Groups -->
    <path d="M 475, 130 C 475, 155, 220, 155, 220, 180" class="base-arrow" marker-end="url(#arrowBase)" />
    <path d="M 475, 130 L 475, 180" class="base-arrow" marker-end="url(#arrowBase)" />
    <path d="M 475, 130 C 475, 155, 780, 155, 780, 180" class="base-arrow" marker-end="url(#arrowBase)" />

    <!-- Platform to Subscriptions -->
    <path d="M 220, 230 C 220, 260, 100, 260, 100, 290" class="base-arrow" marker-end="url(#arrowBase)" />
    <path d="M 220, 230 L 220, 290" class="base-arrow" marker-end="url(#arrowBase)" />
    <path d="M 220, 230 C 220, 260, 340, 260, 340, 290" class="base-arrow" marker-end="url(#arrowBase)" />

    <!-- Landing Zones to Corp & Online -->
    <path d="M 475, 230 C 475, 260, 520, 260, 520, 290" class="base-arrow" marker-end="url(#arrowBase)" />
    <path d="M 475, 230 C 475, 260, 680, 260, 680, 290" class="base-arrow" marker-end="url(#arrowBase)" />

    <!-- Corp to Dev, UAT, Prod -->
    <path d="M 520, 350 C 520, 440, 420, 440, 420, 490" class="base-arrow" marker-end="url(#arrowBase)" />
    <path d="M 520, 350 L 520, 490" class="base-arrow" marker-end="url(#arrowBase)" />
    <path d="M 520, 350 C 520, 440, 620, 440, 620, 490" class="base-arrow" marker-end="url(#arrowBase)" />
  </g>

  <!-- ========================================== -->
  <!-- 2. ANIMATED FLOWING LASER ARROWS          -->
  <!-- ========================================== -->
  <g>
    <path d="M 475, 50 L 475, 80" class="anim-arrow-cyan" marker-end="url(#arrowCyan)" />
    <path d="M 475, 130 C 475, 155, 220, 155, 220, 180" class="anim-arrow-cyan" marker-end="url(#arrowCyan)" />
    <path d="M 475, 130 L 475, 180" class="anim-arrow-purple" marker-end="url(#arrowPurple)" />
    <path d="M 475, 130 C 475, 155, 780, 155, 780, 180" class="anim-arrow-cyan" marker-end="url(#arrowCyan)" />

    <path d="M 220, 230 C 220, 260, 100, 260, 100, 290" class="anim-arrow-cyan" marker-end="url(#arrowCyan)" />
    <path d="M 220, 230 L 220, 290" class="anim-arrow-purple" marker-end="url(#arrowPurple)" />
    <path d="M 220, 230 C 220, 260, 340, 260, 340, 290" class="anim-arrow-cyan" marker-end="url(#arrowCyan)" />

    <path d="M 475, 230 C 475, 260, 520, 260, 520, 290" class="anim-arrow-purple" marker-end="url(#arrowPurple)" />
    <path d="M 475, 230 C 475, 260, 680, 260, 680, 290" class="anim-arrow-cyan" marker-end="url(#arrowCyan)" />

    <path d="M 520, 350 C 520, 440, 420, 440, 420, 490" class="anim-arrow-cyan" marker-end="url(#arrowCyan)" />
    <path d="M 520, 350 L 520, 490" class="anim-arrow-purple" marker-end="url(#arrowPurple)" />
    <path d="M 520, 350 C 520, 440, 620, 440, 620, 490" class="anim-arrow-cyan" marker-end="url(#arrowCyan)" />
  </g>

  <!-- ========================================== -->
  <!-- 3. TRAVELING DATA ORBS                     -->
  <!-- ========================================== -->
  <g>
    <circle r="3" fill="#FFFFFF" filter="url(#neonGlow)">
      <animateMotion path="M 475, 50 L 475, 80" dur="0.8s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#00F0FF" filter="url(#neonGlow)">
      <animateMotion path="M 475, 130 C 475, 155, 220, 155, 220, 180" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#C084FC" filter="url(#neonGlow)">
      <animateMotion path="M 475, 130 L 475, 180" dur="1.1s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#00FF88" filter="url(#neonGlow)">
      <animateMotion path="M 475, 130 C 475, 155, 780, 155, 780, 180" dur="1.4s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#00F0FF" filter="url(#neonGlow)">
      <animateMotion path="M 520, 350 C 520, 440, 420, 440, 420, 490" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#FF007A" filter="url(#neonGlow)">
      <animateMotion path="M 520, 350 L 520, 490" dur="1.3s" repeatCount="indefinite" />
    </circle>
    <circle r="3" fill="#00FF88" filter="url(#neonGlow)">
      <animateMotion path="M 520, 350 C 520, 440, 620, 440, 620, 490" dur="1.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ========================================== -->
  <!-- 4. HIERARCHY CARDS                         -->
  <!-- ========================================== -->
  <g>
    <!-- Top 1: Entra ID Tenant -->
    <rect x="375" y="10" width="200" height="40" class="card-box root-pulse" stroke="#00F0FF" />
    <text x="475" y="35" class="text-title" fill="#00F0FF">🌐 Microsoft Entra ID Tenant</text>

    <!-- Top 2: Tenant Root Group -->
    <rect x="375" y="80" width="200" height="48" class="card-box" stroke="#c084fc" />
    <text x="475" y="110" class="text-title" fill="#c084fc">🏛️ Tenant Root Group</text>

    <!-- Row 1: Platform Management Group -->
    <rect x="130" y="180" width="180" height="50" class="card-box" stroke="#a6e3a1" />
    <text x="220" y="205" class="text-title" fill="#a6e3a1">⚙️ Platform</text>
    <text x="220" y="220" class="text-sub">Management Group</text>

    <!-- Row 1: Landing Zones (Workloads) -->
    <rect x="385" y="180" width="180" height="50" class="card-box" stroke="#f9e2af" />
    <text x="475" y="205" class="text-title" fill="#f9e2af">🚀 Landing Zones</text>
    <text x="475" y="220" class="text-sub">(Workloads)</text>

    <!-- Row 1: Decommissioned / Sandbox -->
    <rect x="690" y="180" width="180" height="50" class="card-box" stroke="#94a3b8" />
    <text x="780" y="205" class="text-title" fill="#94a3b8">🧪 Decommissioned</text>
    <text x="780" y="220" class="text-sub">/ Sandbox</text>

    <!-- Platform Subs (Row 2 Left) -->
    <rect x="30" y="290" width="140" height="60" class="card-box" stroke="#89b4fa" />
    <text x="100" y="315" class="text-title" font-size="11">🔑 Identity</text>
    <text x="100" y="335" class="text-sub">(AD / DNS)</text>

    <rect x="180" y="290" width="140" height="60" class="card-box" stroke="#89b4fa" />
    <text x="250" y="315" class="text-title" font-size="11">📊 Management</text>
    <text x="250" y="335" class="text-sub">(Log Analytics / AMA)</text>

    <rect x="330" y="290" width="140" height="60" class="card-box" stroke="#89b4fa" />
    <text x="400" y="315" class="text-title" font-size="11">🌐 Connectivity</text>
    <text x="400" y="335" class="text-sub">(Hub VNet / FW / ER)</text>

    <!-- Landing Zone Subs (Row 2 Right) -->
    <rect x="490" y="290" width="130" height="60" class="card-box" stroke="#cba6f7" />
    <text x="555" y="315" class="text-title" font-size="11">🏢 Corp</text>
    <text x="555" y="335" class="text-sub">(Internal Only)</text>

    <rect x="635" y="290" width="130" height="60" class="card-box" stroke="#cba6f7" />
    <text x="700" y="315" class="text-title" font-size="11">🌍 Online</text>
    <text x="700" y="335" class="text-sub">(Public / DMZ)</text>

    <!-- Corp Subscriptions (Row 3) -->
    <rect x="375" y="490" width="90" height="50" class="card-box" stroke="#00D084" />
    <text x="420" y="515" class="text-title" font-size="11">📦 Dev</text>
    <text x="420" y="530" class="text-sub">Sub</text>

    <rect x="475" y="490" width="90" height="50" class="card-box" stroke="#f9e2af" />
    <text x="520" y="515" class="text-title" font-size="11">🧪 UAT</text>
    <text x="520" y="530" class="text-sub">Sub</text>

    <rect x="575" y="490" width="90" height="50" class="card-box" stroke="#f38ba8" />
    <text x="620" y="515" class="text-title" font-size="11">🚀 Prod</text>
    <text x="620" y="530" class="text-sub">Sub</text>
  </g>
</svg>
