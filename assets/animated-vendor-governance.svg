<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 170" width="100%" height="170">
  <defs>
    <!-- Glow Filters -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <marker id="arrowCyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00F0FF" />
    </marker>
    <marker id="arrowBase" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2d3748" />
    </marker>

    <pattern id="dotPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#141a2e" />
    </pattern>

    <style>
      .base-arrow {
        fill: none;
        stroke: #252d47;
        stroke-width: 2.2;
        stroke-linecap: round;
      }
      .anim-arrow-cyan {
        fill: none;
        stroke: #00F0FF;
        stroke-width: 2.4;
        stroke-dasharray: 6 10;
        animation: flowDash 1.1s linear infinite;
        filter: url(#neonGlow);
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -32; }
      }
      .card-box {
        fill: #0c1022;
        stroke-width: 1.5;
        rx: 10;
      }
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12.5px;
        font-weight: 700;
        fill: #FFFFFF;
        text-anchor: middle;
      }
      .text-sub {
        font-family: 'SF Mono', Consolas, monospace;
        font-size: 10px;
        fill: #94a3b8;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- PURE JET BLACK BACKGROUND -->
  <rect width="100%" height="100%" fill="#050814" rx="14" />
  <rect width="100%" height="100%" fill="url(#dotPattern)" rx="14" />

  <!-- ========================================== -->
  <!-- 1. BASE STATIC ARROWS                      -->
  <!-- ========================================== -->
  <g>
    <path d="M 160, 85 L 195, 85" class="base-arrow" marker-end="url(#arrowBase)" />
    <path d="M 345, 85 L 380, 85" class="base-arrow" marker-end="url(#arrowBase)" />
    <path d="M 535, 85 L 570, 85" class="base-arrow" marker-end="url(#arrowBase)" />
    <path d="M 725, 85 L 760, 85" class="base-arrow" marker-end="url(#arrowBase)" />
    <path d="M 915, 85 L 950, 85" class="base-arrow" marker-end="url(#arrowBase)" />
  </g>

  <!-- ========================================== -->
  <!-- 2. ANIMATED FLOWING LASER ARROWS          -->
  <!-- ========================================== -->
  <g>
    <path d="M 160, 85 L 195, 85" class="anim-arrow-cyan" marker-end="url(#arrowCyan)" />
    <path d="M 345, 85 L 380, 85" class="anim-arrow-cyan" marker-end="url(#arrowCyan)" />
    <path d="M 535, 85 L 570, 85" class="anim-arrow-cyan" marker-end="url(#arrowCyan)" />
    <path d="M 725, 85 L 760, 85" class="anim-arrow-cyan" marker-end="url(#arrowCyan)" />
    <path d="M 915, 85 L 950, 85" class="anim-arrow-cyan" marker-end="url(#arrowCyan)" />
  </g>

  <!-- ========================================== -->
  <!-- 3. TRAVELING DATA ORBS                     -->
  <!-- ========================================== -->
  <g>
    <circle r="3.5" fill="#FFFFFF" filter="url(#neonGlow)">
      <animateMotion path="M 160, 85 L 195, 85" dur="0.9s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#00F0FF" filter="url(#neonGlow)">
      <animateMotion path="M 345, 85 L 380, 85" dur="0.9s" begin="0.2s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#F9E2AF" filter="url(#neonGlow)">
      <animateMotion path="M 535, 85 L 570, 85" dur="0.9s" begin="0.4s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#F38BA8" filter="url(#neonGlow)">
      <animateMotion path="M 725, 85 L 760, 85" dur="0.9s" begin="0.6s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#00D084" filter="url(#neonGlow)">
      <animateMotion path="M 915, 85 L 950, 85" dur="0.9s" begin="0.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- ========================================== -->
  <!-- 4. GOVERNANCE NODES                        -->
  <!-- ========================================== -->
  <g>
    <!-- Node 1: RFI -->
    <rect x="20" y="48" width="140" height="74" class="card-box" stroke="#89b4fa" />
    <text x="90" y="80" class="text-title">📝 RFI</text>
    <text x="90" y="100" class="text-sub">Market Scan</text>

    <!-- Node 2: RFP -->
    <rect x="195" y="48" width="150" height="74" class="card-box" stroke="#a6e3a1" />
    <text x="270" y="80" class="text-title">📋 RFP</text>
    <text x="270" y="100" class="text-sub">Formal Proposal</text>

    <!-- Node 3: Evaluation Matrix -->
    <rect x="380" y="48" width="155" height="74" class="card-box" stroke="#f9e2af" />
    <text x="457" y="77" class="text-title">⚖️ Evaluation Matrix</text>
    <text x="457" y="97" class="text-sub">Arch, Security &amp; Cost</text>

    <!-- Node 4: SOW & Commercials -->
    <rect x="570" y="48" width="155" height="74" class="card-box" stroke="#fab387" />
    <text x="647" y="77" class="text-title">🤝 SOW &amp; Commercials</text>
    <text x="647" y="97" class="text-sub">Milestones &amp; SLA</text>

    <!-- Node 5: Sprints & Delivery -->
    <rect x="760" y="48" width="155" height="74" class="card-box" stroke="#cba6f7" />
    <text x="837" y="77" class="text-title">🏃 Sprints &amp; Delivery</text>
    <text x="837" y="97" class="text-sub">Governance &amp; RACI</text>

    <!-- Node 6: Sign-Off & Release -->
    <rect x="950" y="48" width="130" height="74" class="card-box" stroke="#00D084" />
    <text x="1015" y="77" class="text-title" fill="#00D084">✅ Sign-Off</text>
    <text x="1015" y="97" class="text-sub">Acceptance Criteria</text>
  </g>
</svg>
