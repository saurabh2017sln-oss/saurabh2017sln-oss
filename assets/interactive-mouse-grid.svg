      <animate attributeName="fill" values="#00FF88;#FFFFFF;#00FF88" dur="1.2s" begin="0.7s" repeatCount="indefinite" />
    </circle>
    <circle cx="660" cy="130" r="12" fill="none" stroke="#00FF88" stroke-width="1.5" opacity="0">
