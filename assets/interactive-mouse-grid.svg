      <animate attributeName="r" values="3.5;8;3.5" dur="1.4s" begin="1.0s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="1.0s" repeatCount="indefinite" />
    </circle>

    <!-- Node 7 -->
    <circle cx="340" cy="90" r="5" fill="#00FF88" filter="url(#laserGlow)">
      <animate attributeName="r" values="3.5;9;3.5" dur="1.6s" begin="1.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" begin="1.2s" repeatCount="indefinite" />
    </circle>

    <!-- Node 8 -->
    <circle cx="320" cy="220" r="5" fill="#FF007A" filter="url(#laserGlow)">
      <animate attributeName="r" values="3.5;8;3.5" dur="1.9s" begin="1.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" begin="1.4s" repeatCount="indefinite" />
    </circle>

    <!-- Node 9 -->
    <circle cx="420" cy="140" r="6" fill="#00F0FF" filter="url(#laserGlow)">
      <animate attributeName="r" values="4;10;4" dur="1.1s" begin="0.3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.1s" begin="0.3s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#00F0FF;#FFFFFF;#00F0FF" dur="1.1s" begin="0.3s" repeatCount="indefinite" />
    </circle>
    <circle cx="420" cy="140" r="12" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="6;32;6" dur="1.1s" begin="0.3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0;0.9" dur="1.1s" begin="0.3s" repeatCount="indefinite" />
    </circle>

    <!-- Node 10 -->
    <circle cx="460" cy="70" r="5" fill="#A855F7" filter="url(#laserGlow)">
      <animate attributeName="r" values="3.5;8;3.5" dur="2.2s" begin="1.7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="1.7s" repeatCount="indefinite" />
    </circle>

    <!-- Node 11 -->
    <circle cx="480" cy="230" r="5" fill="#00FF88" filter="url(#laserGlow)">
      <animate attributeName="r" values="3.5;9;3.5" dur="1.3s" begin="0.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.3s" begin="0.1s" repeatCount="indefinite" />
    </circle>

    <!-- Node 12 -->
    <circle cx="520" cy="160" r="5" fill="#FF007A" filter="url(#laserGlow)">
      <animate attributeName="r" values="3.5;8;3.5" dur="1.7s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" begin="0.5s" repeatCount="indefinite" />
    </circle>

    <!-- Node 13 -->
    <circle cx="580" cy="80" r="6" fill="#00F0FF" filter="url(#laserGlow)">
      <animate attributeName="r" values="4;9;4" dur="1.5s" begin="0.9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.9s" repeatCount="indefinite" />
    </circle>

    <!-- Node 14 -->
    <circle cx="620" cy="210" r="5" fill="#A855F7" filter="url(#laserGlow)">
