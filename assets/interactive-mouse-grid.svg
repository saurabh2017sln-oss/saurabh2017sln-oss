  <!-- FLYING LIGHT PACKETS (DATA BURSTS) -->
  <g>
    <circle r="4" fill="#FFFFFF" filter="url(#laserGlow)">
      <animateMotion path="M 60,70 L 140,130 L 240,60 L 340,90 L 460,70 L 580,80 L 700,60 L 840,80 L 920,130" dur="4.0s" repeatCount="indefinite" />
    </circle>
    <circle r="4" fill="#00F0FF" filter="url(#laserGlow)">
      <animateMotion path="M 940,220 L 860,200 L 740,220 L 620,210 L 480,230 L 320,220 L 180,230 L 90,210" dur="5.0s" repeatCount="indefinite" />
    </circle>
    <circle r="4.5" fill="#FF007A" filter="url(#laserGlow)">
      <animateMotion path="M 420,140 L 520,160 L 660,130 L 780,140 L 920,130" dur="2.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- HUD LABELS & SYSTEM TELEMETRY -->
  <text x="25" y="30" class="hud-text">SYNAPSE_GRID // TRUE_BLACK_SCENE</text>
  <text x="500.0" y="30" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="900" font-size="13" fill="#00F0FF" letter-spacing="3">
    ⚡ QUANTUM NEURAL LIGHT SCENE // LIVE BLINKING NODES ⚡
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite" />
  </text>
  <text x="975" y="30" text-anchor="end" class="hud-text">CIRCUIT: ACTIVE</text>
</svg>