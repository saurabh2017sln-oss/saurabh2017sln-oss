      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" begin="0.7s" repeatCount="indefinite" />
    </circle>

    <!-- Node 16 -->
    <circle cx="700" cy="60" r="5" fill="#FF007A" filter="url(#laserGlow)">
      <animate attributeName="r" values="3.5;8;3.5" dur="1.4s" begin="1.1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" begin="1.1s" repeatCount="indefinite" />
    </circle>

    <!-- Node 17 -->
    <circle cx="740" cy="220" r="5" fill="#00F0FF" filter="url(#laserGlow)">
      <animate attributeName="r" values="3.5;9;3.5" dur="1.6s" begin="0.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" begin="0.2s" repeatCount="indefinite" />
