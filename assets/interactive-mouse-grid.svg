<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280">
  <defs>
    <!-- True Pitch Black Background Glow Filters -->
    <filter id="laserGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="7" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="hyperGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Moving Laser Light Sweep Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>

    <!-- Radar Sweep Conic-like Gradient -->
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="dotMatrix" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#132338" />
    </pattern>

    <style>
      .synapse-bg {
        stroke: #0a1e33;
        stroke-width: 1.2;
      }
      .synapse-active {
        stroke: #00F0FF;
        stroke-width: 2.2;
        filter: url(#laserGlow);
        stroke-dasharray: 80, 220;
        animation: pulseElectricity 3.5s linear infinite;
      }
      .synapse-purple {
        stroke: #A855F7;
        stroke-width: 2;
        filter: url(#laserGlow);
        stroke-dasharray: 60, 200;
        animation: pulseElectricity 4.2s linear infinite reverse;
      }
      @keyframes pulseElectricity {
        0% { stroke-dashoffset: 300; }
        100% { stroke-dashoffset: -300; }
      }
      @keyframes sweepRay {
        0% { transform: translateX(-250px); }
        100% { transform: translateX(1250px); }
      }
      .laser-ray {
        animation: sweepRay 4.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .hud-text {
        font-family: 'Courier New', monospace;
        font-size: 11px;
        fill: #00F0FF;
        letter-spacing: 2px;
      }
      @keyframes crosshairPulse {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .aim-reticle {
        transform-origin: center;
        animation: crosshairPulse 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- TRUE PURE JET BLACK BACKGROUND -->
  <rect width="100%" height="100%" fill="#000000" rx="14" />
  <rect width="100%" height="100%" fill="url(#dotMatrix)" rx="14" />

  <!-- MOVING LASER LIGHT SWEEPER (SIMULATING MOVING LIGHT BEAM ACROSS BLACK SCREEN) -->
  <rect class="laser-ray" y="0" width="220" height="280" fill="url(#beamGrad)" opacity="0.3" />

  <!-- BASE SYNAPSE CONNECTIONS -->
  <g>
    <line x1="60" y1="70" x2="140" y2="130" class="synapse-bg" />
    <line x1="140" y1="130" x2="90" y2="210" class="synapse-bg" />
    <line x1="90" y1="210" x2="180" y2="230" class="synapse-bg" />
    <line x1="140" y1="130" x2="240" y2="60" class="synapse-bg" />
    <line x1="240" y1="60" x2="340" y2="90" class="synapse-bg" />
    <line x1="340" y1="90" x2="280" y2="150" class="synapse-bg" />
    <line x1="280" y1="150" x2="320" y2="220" class="synapse-bg" />
    <line x1="340" y1="90" x2="420" y2="140" class="synapse-bg" />
    <line x1="420" y1="140" x2="460" y2="70" class="synapse-bg" />
    <line x1="420" y1="140" x2="480" y2="230" class="synapse-bg" />
    <line x1="420" y1="140" x2="520" y2="160" class="synapse-bg" />
    <line x1="460" y1="70" x2="580" y2="80" class="synapse-bg" />
    <line x1="520" y1="160" x2="580" y2="80" class="synapse-bg" />
    <line x1="520" y1="160" x2="620" y2="210" class="synapse-bg" />
    <line x1="520" y1="160" x2="660" y2="130" class="synapse-bg" />
    <line x1="580" y1="80" x2="660" y2="130" class="synapse-bg" />
    <line x1="580" y1="80" x2="700" y2="60" class="synapse-bg" />
    <line x1="660" y1="130" x2="740" y2="220" class="synapse-bg" />
    <line x1="660" y1="130" x2="780" y2="140" class="synapse-bg" />
    <line x1="700" y1="60" x2="780" y2="140" class="synapse-bg" />
    <line x1="780" y1="140" x2="840" y2="80" class="synapse-bg" />
    <line x1="780" y1="140" x2="860" y2="200" class="synapse-bg" />
    <line x1="840" y1="80" x2="920" y2="130" class="synapse-bg" />
    <line x1="860" y1="200" x2="920" y2="130" class="synapse-bg" />
    <line x1="860" y1="200" x2="940" y2="220" class="synapse-bg" />
    <line x1="840" y1="80" x2="940" y2="70" class="synapse-bg" />
    <line x1="920" y1="130" x2="940" y2="70" class="synapse-bg" />
  </g>

  <!-- ACTIVE ELECTRIC LIGHT PULSES (CYAN & PURPLE BEAMS) -->
  <g>
    <line x1="60" y1="70" x2="140" y2="130" class="synapse-active" style="animation-duration: 2.2s;" />
    <line x1="90" y1="210" x2="180" y2="230" class="synapse-purple" style="animation-duration: 3.8s;" />
    <line x1="240" y1="60" x2="340" y2="90" class="synapse-active" style="animation-duration: 3.0s;" />
    <line x1="280" y1="150" x2="320" y2="220" class="synapse-purple" style="animation-duration: 2.4s;" />
    <line x1="420" y1="140" x2="460" y2="70" class="synapse-active" style="animation-duration: 3.5s;" />
    <line x1="420" y1="140" x2="520" y2="160" class="synapse-active" style="animation-duration: 2.8s;" />
    <line x1="520" y1="160" x2="580" y2="80" class="synapse-purple" style="animation-duration: 2.2s;" />
    <line x1="520" y1="160" x2="660" y2="130" class="synapse-active" style="animation-duration: 3.6s;" />
    <line x1="580" y1="80" x2="700" y2="60" class="synapse-purple" style="animation-duration: 3.0s;" />
    <line x1="660" y1="130" x2="780" y2="140" class="synapse-active" style="animation-duration: 2.2s;" />
    <line x1="780" y1="140" x2="840" y2="80" class="synapse-purple" style="animation-duration: 3.8s;" />
    <line x1="840" y1="80" x2="920" y2="130" class="synapse-active" style="animation-duration: 2.8s;" />
    <line x1="860" y1="200" x2="940" y2="220" class="synapse-purple" style="animation-duration: 2.4s;" />
    <line x1="920" y1="130" x2="940" y2="70" class="synapse-active" style="animation-duration: 3.5s;" />
  </g>

  <!-- RAPIDLY BLINKING NEURAL LIGHT NODES (WHEREVER LIGHT TOUCHES, IT BLINKS!) -->
  <g>
    <!-- Node 1 -->
    <circle cx="60" cy="70" r="5" fill="#00F0FF" filter="url(#laserGlow)">
      <animate attributeName="r" values="3.5;9;3.5" dur="1.2s" begin="0.0s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.0s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#00F0FF;#FFFFFF;#00F0FF" dur="1.2s" begin="0.0s" repeatCount="indefinite" />
    </circle>
    <circle cx="60" cy="70" r="10" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="5;28;5" dur="1.2s" begin="0.0s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" begin="0.0s" repeatCount="indefinite" />
    </circle>

    <!-- Node 2 -->
    <circle cx="140" cy="130" r="5" fill="#A855F7" filter="url(#laserGlow)">
      <animate attributeName="r" values="3.5;8;3.5" dur="1.5s" begin="0.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.2s" repeatCount="indefinite" />
    </circle>

    <!-- Node 3 -->
    <circle cx="90" cy="210" r="5" fill="#00FF88" filter="url(#laserGlow)">
      <animate attributeName="r" values="3.5;9;3.5" dur="1.8s" begin="0.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" begin="0.4s" repeatCount="indefinite" />
    </circle>

    <!-- Node 4 -->
    <circle cx="180" cy="230" r="5" fill="#FF007A" filter="url(#laserGlow)">
      <animate attributeName="r" values="3.5;8;3.5" dur="2.1s" begin="0.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" begin="0.6s" repeatCount="indefinite" />
    </circle>

    <!-- Node 5 -->
    <circle cx="240" cy="60" r="5" fill="#00F0FF" filter="url(#laserGlow)">
      <animate attributeName="r" values="3.5;9;3.5" dur="1.3s" begin="0.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.3s" begin="0.8s" repeatCount="indefinite" />
