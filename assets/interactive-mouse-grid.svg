      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" begin="0.8s" repeatCount="indefinite" />
    </circle>

    <!-- Node 19 -->
    <circle cx="840" cy="80" r="5" fill="#00FF88" filter="url(#laserGlow)">
      <animate attributeName="r" values="3.5;9;3.5" dur="2.1s" begin="1.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" begin="1.4s" repeatCount="indefinite" />
    </circle>

    <!-- Node 20 -->
